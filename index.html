ns:["叶黄素","糖分","食盐","咖啡因"],correctIndex:0,explanation:"叶黄素存在于黄斑区，有助于过滤蓝光、保护视网膜。"},{id:6,question:"长时间盯屏幕导致眼睛干涩，最有效的缓解方式是？",options:["用力揉眼","主动眨眼并远眺","滴任意眼药水","继续看屏幕"],correctIndex:1,explanation:"主动眨眼可以均匀分布泪膜，远眺能放松睫状肌。"},{id:7,question:"儿童青少年每天户外活动多长时间有助于预防近视？",options:["10 分钟","30 分钟","至少 1 小时","不需要户外活动"],correctIndex:2,explanation:"研究表明每天 1 小时以上的户外活动能有效预防近视发展。"},{id:8,question:"关于视力测试中的「E 视标」，以下说法正确的是？",options:["只有 E 字","基于 5×5 网格的标准化视标","随机图形","彩色图案"],correctIndex:1,explanation:"E 视标基于 5×5 网格，笔画和间隙各占 1/5，是标准化的视力检查工具。"},{id:9,question:"夜间使用电子设备时，以下哪种做法最护眼？",options:["调到最高亮度","开启护眼模式/夜间模式","关闭所有灯光","离屏幕更近"],correctIndex:1,explanation:"护眼模式能减少蓝光输出，降低对褪黑素分泌的影响。"},{id:10,question:"以下哪个不是近视的常见早期信号？",options:["看远处模糊","频繁眯眼","眼睛干涩疲劳","听力下降"],correctIndex:3,explanation:"听力下降与近视无关。看远模糊、眯眼、眼疲劳是近视的常见信号。"}],U=[{id:"art-20-20-20",title:"20-20-20 法则：最简单的护眼习惯",category:"用眼习惯",readTime:"2 分钟",content:["长时间盯着屏幕是现代人视疲劳的头号元凶。美国眼科学会推荐的 20-20-20 法则是最简单、最容易坚持的护眼习惯。","规则很简单：每使用电子屏幕 20 分钟，就把视线移到 20 英尺（约 6 米）以外的物体上，保持 20 秒。","在这 20 秒里，你的睫状肌会从持续紧张的「对焦」状态中放松下来，泪膜也会重新均匀分布在眼球表面。","可以在手机或电脑上设置每 20 分钟一次的提醒。坚持一周，你会发现眼睛没那么干涩了。"]},{id:"art-screen-distance",title:"屏幕距离与高度：被忽略的细节",category:"用眼环境",readTime:"2 分钟",content:["屏幕离眼睛太近，睫状肌需要更用力地对焦，时间一长就会酸痛。电脑屏幕的理想距离是 50-70 厘米，大约一臂长。","屏幕高度也很关键。屏幕中心应略低于视线水平 10-15 度，这样眼睑自然微垂，减少眼球暴露面积，降低蒸发。","手机阅读时尽量举高一些，不要低头驼背——既保护颈椎，也减少眼睛与屏幕的距离差。","如果屏幕太小、字太小，不要凑近看，而是放大字体或使用更大屏幕。"]},{id:"art-lighting",title:"光线环境：亮不等于好",category:"用眼环境",readTime:"3 分钟",content:["很多人以为越亮越好，其实过强的光线同样会伤害眼睛。理想的阅读光线是均匀、柔和、无眩光的。","白天优先利用自然光，但避免阳光直射屏幕或眼睛。晚上使用台灯时，不要只开台灯而关掉房间灯——明暗对比过大会加重视疲劳。","台灯应放在书写手的对侧（右撇子放左侧），灯罩遮住灯泡，避免直射眼睛。","色温方面，4000K 左右的暖白光比较适合长时间阅读，既不昏暗也不刺眼。"]},{id:"art-nutrition",title:"吃出来的好视力：护眼营养素",category:"营养护眼",readTime:"3 分钟",content:["眼睛也需要「吃饭」。以下几种营养素对维持眼部健康至关重要：","叶黄素与玉米黄质：存在于菠菜、羽衣甘蓝、玉米等深绿色和黄色蔬菜中，是黄斑区的重要成分，能过滤有害蓝光。","维生素 A：动物肝脏、胡萝卜、南瓜中含量丰富，是视紫红质的原料，缺乏会导致夜盲症。","Omega-3 脂肪酸：深海鱼、亚麻籽中含量高，有助于维持泪膜稳定，缓解干眼。","花青素：蓝莓、紫薯、桑葚中含量丰富，能促进视网膜视紫红质的再生。","均衡饮食比单一补充剂更有效。多吃彩虹色的蔬菜水果，眼睛会感谢你。"]},{id:"art-checkup",title:"定期检查：眼睛也需要「体检」",category:"定期检查",readTime:"2 分钟",content:["很多眼部疾病在早期没有明显症状，等到发现时可能已经造成不可逆的损伤。定期检查是早发现、早治疗的关键。","成年人建议每年进行一次全面的眼科检查，包括视力、眼压、眼底等。","高度近视者（600 度以上）是视网膜脱离、青光眼等疾病的高危人群，建议每半年检查一次眼底。","糖尿病患者更需要密切关注眼底变化，糖尿病视网膜病变是致盲的主要原因之一。","儿童从 3 岁起就应建立屈光发育档案，跟踪视力变化，及早干预近视。"]},{id:"art-dry-eye",title:"干眼症：现代人的「流行病」",category:"常见问题",readTime:"3 分钟",content:["如果你经常觉得眼睛干涩、异物感、畏光、容易流泪，可能已经患上了干眼症。","正常情况下，我们每分钟眨眼 15-20 次。但盯着屏幕时，眨眼次数会骤降到 5-7 次，泪膜来不及更新，眼睛自然干涩。","缓解干眼的第一步是「主动眨眼」——有意识地完整闭合眼睑，像挤牙膏一样把泪液均匀涂抹在眼球表面。","可以使用不含防腐剂的人工泪液润滑，但避免过度依赖含血管收缩剂的「去红」眼药水。","如果环境干燥，可以在桌上放一个加湿器。空调出风口不要直吹面部。","症状持续不缓解时，请及时就医，干眼也可能与其他疾病相关。"]}],I=[{name:"闭眼深呼吸",duration:15,instruction:"轻轻闭眼，深吸气 3 秒，缓慢呼气 3 秒，放松全身。"},{name:"用力眨眼",duration:20,instruction:"用力闭眼 2 秒，然后睁开 2 秒，重复 5 次，促进泪液分泌。"},{name:"远近调节",duration:30,instruction:"看远处（6 米外）5 秒，再看近处（30 厘米）5 秒，交替进行。"},{name:"眼球转动",duration:30,instruction:"眼球缓慢顺时针转 3 圈，再逆时针转 3 圈，幅度尽量大。"},{name:"穴位按压",duration:30,instruction:"双手搓热，用指腹轻按攒竹、睛明、四白穴各 5 秒，重复 2 次。"},{name:"掌心捂眼",duration:20,instruction:"双手搓热后捂住闭着的眼睛，感受掌心温度，放松 20 秒。"}],Tt=[{name:"创作者 A",platform:"GitHub",url:"https://github.com",icon:"🐙"},{name:"创作者 B",platform:"Bilibili",url:"https://bilibili.com",icon:"📺"},{name:"创作者 C",platform:"知乎",url:"https://zhihu.com",icon:"💡"},{name:"创作者 D",platform:"微博",url:"https://weibo.com",icon:"🐦"}];class Ct{constructor(){l(this,"currentGrade",V);l(this,"rightRecords",[]);l(this,"leftRecords",[]);l(this,"currentEye","right");l(this,"locked",!1);l(this,"currentDirection",null);l(this,"maxGradeStreak",0)}startEye(t){return this.currentEye=t,this.currentGrade=V,this.locked=!1,this.maxGradeStreak=0,t==="right"?this.rightRecords=[]:this.leftRecords=[],this.currentDirection=this.randomDirection(),{grade:this.currentGrade,direction:this.currentDirection}}getCurrentQuestion(){return(this.currentEye==="right"?this.rightRecords:this.leftRecords).length>=D?null:(this.currentDirection||(this.currentDirection=this.randomDirection()),{grade:this.currentGrade,direction:this.cu
